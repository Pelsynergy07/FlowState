[project]
name = "flowstate"
dynamic = ["version"]
description = "Local, offline voice dictation with screen-context capture for Windows"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
urls = { Homepage = "https://github.com/Pelsynergy07/FlowState", Repository = "https://github.com/Pelsynergy07/FlowState" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "flowstate.__version__" }

[tool.setuptools.package-data]
"flowstate.resources" = ["*.json", "fonts/*.ttf"]
